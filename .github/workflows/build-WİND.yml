name: WindOS Quantum Engine CI/CD

# Workflow'un ne zaman çalışacağını belirliyoruz (Kodu pushladığında otomatik başlar)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repoyu Sunucuya Çek
      uses: actions/checkout@v3

    - name: 🛠️ Gerekli Derleyici Araçlarını (Toolchain) Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib mtools xorriso grub-pc-bin grub-common

    - name: 🛡️ Anti-Skew ve Font Kalkanı Testi (Yazılar Çarpılmış mı?)
      run: |
        echo "Ekran çarpılması ve yazı silinmesi güvenlik kontrolleri yapılıyor..."
        
        # Kernel dosyasındaki güvenlik önlemlerini kontrol ediyoruz
        if grep -q "BPP == 3" kernel.c && grep -q "ch >= 'a' && ch <= 'z'" kernel.c; then
          echo "✅ BAŞARILI: Anti-Skew (Çarpılma Önleyici) motoru ve Font kalkanı yerinde duruyor."
          echo "Yazılar ÇARPILMAMIŞ ve SİLİNMEMİŞ. Derleme işlemine geçiliyor..."
        else
          echo "❌ HATA: Güvenlik kalkanları eksik! Yazılar çarpılabilir veya silinebilir!"
          echo "Lütfen kernel.c dosyasındaki VESA motorunu ve Font düzeltmesini kontrol edin."
          exit 1 # Kalkan yoksa Workflow'u acımasızca durdurur!
        fi

    - name: ⚙️ Bootloader'ı Derle (boot.asm)
      run: nasm -f elf32 boot.asm -o boot.o

    - name: 🧠 Çekirdeği Derle (kernel.c)
      run: gcc -m32 -ffreestanding -fno-builtin -fno-stack-protector -O2 -Wall -c kernel.c -o kernel.o

    - name: 🔗 Sistemi Bağla (Linker)
      run: ld -m elf_i386 -T linker.ld boot.o kernel.o -o kernel.bin

    - name: 💿 Önyüklenebilir ISO Dosyası Oluştur (VirtualBox İçin)
      run: |
        mkdir -p isodir/boot/grub
        cp kernel.bin isodir/boot/
        
        # GRUB menü dosyasını otomatik oluşturuyoruz
        cat <<EOF > isodir/boot/grub/grub.cfg
        menuentry "WindOS V14.3 Quantum (Anti-Skew)" {
            multiboot /boot/kernel.bin
        }
        EOF
        
        grub-mkrescue -o WindOS-Quantum.iso isodir

    - name: 🚀 Derlenen Kusursuz İşletim Sistemini Yükle (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: WindOS-Quantum-ISO
        path: WindOS-Quantum.iso
